name: Link Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  internal-links:
    name: Internal links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.0"
          extended: true

      - name: Build Hugo site
        run: hugo --cleanDestinationDir --minify

      - name: Check generated internal links and assets
        run: CHECK_ROOT=public python3 scripts/check-internal-links.py
